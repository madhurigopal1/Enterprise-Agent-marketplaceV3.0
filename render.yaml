services:
  - type: web
    name: enterprise-agent-marketplace
    runtime: python
    branch: recent
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn run:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: POC_REQUIRE_REJECT_REASON
        value: false
